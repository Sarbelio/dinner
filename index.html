<title>오늘 저녁 뭐 해 먹지?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f4ee; --card:#fff; --ink:#2b2622; --muted:#7d736a; --line:#e6ddd1;
    --accent:#3d7a4f; --accent-soft:#e2f0e5; --warm:#c8641e; --warm-soft:#fbeadb;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1a1916; --card:#25231f; --ink:#f2ede6; --muted:#aaa094; --line:#3b3732;
      --accent:#6cc283; --accent-soft:#1f3326; --warm:#f0955a; --warm-soft:#3a2a1e; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  html,body{overscroll-behavior-y:none}
  .tip,.shop,.dish h3{-webkit-user-select:text;user-select:text}
  html{font-size:18px}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.55}
  .wrap{max-width:640px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(70px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
  h1{font-size:1.75rem;font-weight:900;margin:0 0 4px;letter-spacing:-.5px}
  .sub{color:var(--muted);margin:0;font-size:1rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:16px}
  .q{font-size:1.1rem;font-weight:700;margin:0 0 10px}
  .q small{font-weight:400;color:var(--muted);font-size:.85rem;margin-left:4px}
  .big2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .bigopt{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:14px;padding:16px 10px;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer}
  .bigopt span{display:block;font-size:.8rem;font-weight:400;color:var(--muted);margin-top:2px}
  .bigopt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:9px 15px;border-radius:999px;font:inherit;font-size:1rem;cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .toggles{display:flex;flex-direction:column;gap:10px}
  .tg{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;cursor:pointer;background:transparent;color:var(--ink);font:inherit;font-size:1.02rem;text-align:left}
  .tg .sw{width:50px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.2s}
  .tg .sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
  .tg.on{border-color:var(--accent)}
  .tg.on .sw{background:var(--accent)}
  .tg.on .sw::after{left:25px}
  .go{display:block;width:100%;margin-top:18px;border:none;border-radius:16px;padding:18px;background:var(--warm);color:#fff;font:inherit;font-size:1.25rem;font-weight:900;cursor:pointer}
  .go:active,.btn:active,.bigopt:active,.chip:active,.tg:active,.swap:active{transform:scale(.97)}
  .addrow{display:flex;gap:8px}
  .addrow input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:1rem;background:var(--bg);color:var(--ink);-webkit-appearance:none}
  .addrow input:focus{outline:none;border-color:var(--accent)}
  .addrow button{border:none;border-radius:12px;padding:0 20px;background:var(--accent);color:#fff;font:inherit;font-size:1rem;font-weight:700;cursor:pointer;flex:none}
  .hint{font-size:.85rem;color:var(--muted);margin:6px 0 10px}
  .chip.mine{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.mine::after{content:' ✕';font-size:.8rem;opacity:.8}
  .quick{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
  .quick summary{cursor:pointer;color:var(--muted);font-size:.95rem;padding:4px 0}
  .quick .chips{margin-top:8px}
  .quick .chip.on{opacity:.45}
  .web{margin-top:16px;border-radius:14px;border:1.5px dashed var(--line);padding:14px 16px}
  .web b{display:block;margin-bottom:2px}
  .web p{margin:0 0 10px;font-size:.88rem;color:var(--muted)}
  .web input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:1rem;background:var(--bg);color:var(--ink);-webkit-appearance:none}
  .links{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
  .links a{display:block;text-align:center;text-decoration:none;border-radius:10px;padding:11px 4px;font-size:.92rem;font-weight:700;background:var(--warm-soft);color:var(--warm)}
  .note{font-size:.92rem;color:var(--warm);margin:10px 0 0}
  .clear{background:none;border:none;color:var(--muted);font:inherit;font-size:.9rem;text-decoration:underline;cursor:pointer;padding:0;margin-top:10px}
  .dish{border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
  .dish .kind{font-size:.85rem;font-weight:700;color:var(--warm)}
  .dish h3{font-size:1.5rem;font-weight:900;margin:2px 0 6px;letter-spacing:-.3px}
  .dish .time{font-size:.95rem;color:var(--muted)}
  .ings{margin:10px 0 6px;display:flex;flex-wrap:wrap;gap:6px}
  .ing{font-size:.9rem;padding:3px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
  .ing.have{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:700}
  .tip{font-size:.95rem;background:var(--warm-soft);border-radius:10px;padding:9px 12px;margin-top:8px}
  .swap{margin-top:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;font-size:.95rem;cursor:pointer}
  .shop{margin-top:14px;border-radius:14px;background:var(--bg);padding:14px 16px}
  .shop b{display:block;margin-bottom:4px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .btn{border:none;border-radius:14px;padding:15px;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer}
  .btn.ok{background:var(--accent);color:#fff}
  .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
  .done{margin-top:12px;text-align:center;font-weight:700;color:var(--accent);font-size:1.1rem}
  .hist{display:flex;flex-direction:column;gap:6px}
  .hist div{font-size:.95rem;display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:4px 0}
  .hist small{color:var(--muted)}
  .empty{color:var(--muted);font-size:.95rem}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .rise{animation:rise .35s ease-out}
</style>
</head>
<body>
<div class="wrap">
  <h1>🍲 오늘 저녁 뭐 해 먹지?</h1>
  <p class="sub">몇 가지만 고르고 아래 주황색 버튼을 눌러 주세요.</p>

  <div class="card">
    <p class="q">1. 어떻게 차릴까요?</p>
    <div class="big2" id="style">
      <button class="bigopt on" data-v="set">🍚 국 + 반찬<span>찌개·국 하나, 메인 반찬 하나</span></button>
      <button class="bigopt" data-v="bowl">🥘 한 그릇 요리<span>카레·볶음밥·국수처럼 간단히</span></button>
    </div>
  </div>

  <div class="card">
    <p class="q">2. 냉장고에 있는 재료 <small>직접 써서 추가해 주세요 (안 넣어도 돼요)</small></p>
    <form class="addrow" id="addForm">
      <input id="ingInput" type="text" placeholder="예: 삼겹살, 애호박, 두부" autocomplete="off" enterkeyhint="done">
      <button type="submit">추가</button>
    </form>
    <p class="hint">쉼표(,)로 여러 개를 한 번에 넣을 수 있어요. 재료를 누르면 지워져요.</p>
    <div class="chips" id="mine"></div>
    <details class="quick">
      <summary>자주 쓰는 재료에서 고르기</summary>
      <div class="chips" id="ings"></div>
    </details>
    <button class="clear" id="clearIngs">내 재료 모두 지우기</button>
  </div>

  <div class="card">
    <p class="q">3. 오늘 사정은요?</p>
    <div class="toggles">
      <button class="tg" data-k="quick">⏱ 30분 안에 끝나는 걸로<span class="sw"></span></button>
      <button class="tg" data-k="mild">👶 맵지 않게 (아이도 먹어요)<span class="sw"></span></button>
      <button class="tg on" data-k="norepeat">🔁 최근 3일 동안 먹은 건 빼고<span class="sw"></span></button>
    </div>
    <button class="go" id="go">오늘 저녁 추천받기</button>
  </div>

};
const ALL_DB_INGS = new Set(DISHES.flatMap(d=>d.i));
function canon(w){
  w=w.trim();
  for(const [c,list] of Object.entries(ALIAS)) if(w===c || list.includes(w)) return c;
  return w;
}
// 사용자 재료가 요리 재료 x에 해당하는지
function has(x){
  for(const w of S.have){
    const c=canon(w);
    if(c===x) return true;
    if(c.length>=2 && x.length>=2 && (x.includes(c) || c.includes(x))) return true; // 예: 들깨 ↔ 들깨가루, 고기 ↔ 돼지고기
  }
  return false;
}
// 앱 안 요리에 쓰이는 재료인지
function known(w){
  const c=canon(w);
  if(ALL_DB_INGS.has(c)) return true;
  return c.length>=2 && [...ALL_DB_INGS].some(x=>x.length>=2 && (x.includes(c)||c.includes(x)));
}
function saveHave(){ store.set('dn_have',[...S.have]); }
function addWords(text){
  text.split(/[,，、\n]+/).map(s=>s.trim()).filter(Boolean).forEach(w=>{
    if(w.length>20) w=w.slice(0,20);
    S.have.add(w);
  });
  saveHave(); renderIngs();
}
$('addForm').addEventListener('submit',e=>{
  e.preventDefault();
  const inp=$('ingInput'); if(!inp.value.trim()) return;
  addWords(inp.value); inp.value=''; inp.focus();
});
function renderIngs(){
  const mine=$('mine'); mine.innerHTML='';
  if(!S.have.size){ mine.innerHTML='<p class="empty" style="margin:0">아직 넣은 재료가 없어요.</p>'; }
  [...S.have].forEach(x=>{
    const b=document.createElement('button'); b.type='button'; b.className='chip mine'; b.textContent=x;
    b.onclick=()=>{S.have.delete(x); saveHave(); renderIngs()};
    mine.appendChild(b);
  });
  const box=$('ings'); box.innerHTML='';
  ING_CHIPS.forEach(x=>{
    const on=S.have.has(x);
    const b=document.createElement('button'); b.type='button'; b.className='chip'+(on?' on':''); b.textContent=(on?'✔ ':'+ ')+x;
    b.onclick=()=>{ on?S.have.delete(x):S.have.add(x); saveHave(); renderIngs(); };
    box.appendChild(b);
  });
}
$('clearIngs').onclick=()=>{S.have.clear(); saveHave(); renderIngs()};

// ---- 추천 로직 ----
function recent(){
  if(!S.norepeat) return new Set();
  const cut=Date.now()-3*86400000;
  return new Set(S.hist.filter(h=>h.ts>=cut).flatMap(h=>h.names));
}
function candidates(type, exclude=[]){
  const rec=recent();
  let list=DISHES.filter(d=>d.t===type && !rec.has(d.n) && !exclude.includes(d.n)
    && (!S.quick || d.min<=30) && (!S.mild || !d.sp));
  return list;
}
// 가진 재료를 많이 쓰는 요리일수록 뽑힐 확률이 높아짐
function weightedPick(list, avoidIngs=[]){
  if(!list.length) return null;
  const w=list.map(d=>{
    const hit=d.i.filter(x=>has(x)).length;
    let s = S.have.size ? (hit? 1+hit*3 : 0.25) : 1;
    // 국과 반찬이 같은 주재료면 덜 뽑히게
    if(d.i.some(x=>avoidIngs.includes(x) && !STAPLE.includes(x) && ['돼지고기','소고기','닭고기','생선','오징어','김치','두부','어묵','참치캔','햄'].includes(x))) s*=0.3;
    return s;
  });
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let k=0;k<list.length;k++){ r-=w[k]; if(r<=0) return list[k]; }
  return list[list.length-1];
}
function slots(){ return S.style==='set' ? [['soup','국 · 찌개'],['main','메인 반찬']] : [['bowl','한 그릇 요리']]; }
function pickSlot(type, exclude=[]){
  const other = Object.entries(S.picked).filter(([k])=>k!==type).flatMap(([,d])=>d?d.i:[]);
  return weightedPick(candidates(type, exclude), other);
}
function recommend(){
  S.picked={};
  slots().forEach(([t])=>{ S.picked[t]=pickSlot(t); });
  renderResult(true);
  $('result').scrollIntoView({behavior:'smooth',block:'start'});
}
$('go').onclick=recommend;

// ---- 결과 화면 ----
function renderResult(anim){
  const box=$('result');
  const sl=slots();
  let html=`<div class="card${anim?' rise':''}"><p class="q">오늘 저녁 추천 🍽</p>`;
  let need=new Set(); let total=0; let any=false;
  sl.forEach(([t,label])=>{
    const d=S.picked[t];
    if(!d){ html+=`<div class="dish"><div class="kind">${label}</div><p class="empty">조건에 맞는 요리가 없어요. '30분 안에'나 '맵지 않게'를 꺼 보세요.</p></div>`; return; }
    any=true; total=Math.max(total,d.min);
    d.i.forEach(x=>{ if(!STAPLE.includes(x) && !has(x)) need.add(x); });
    html+=`<div class="dish">
      <div class="kind">${label}</div>
      <h3>${esc(d.n)}</h3>
      <div class="time">⏱ 약 ${d.min}분${d.sp?' · 🌶 매콤':''}</div>
      <div class="ings">${d.i.map(x=>`<span class="ing${has(x)?' have':''}">${has(x)?'✔ ':''}${esc(x)}</span>`).join('')}</div>
      <div class="tip">💡 ${esc(d.tip)}</div>
      <button class="swap" data-t="${t}">↻ 이것만 다른 걸로</button>
    </div>`;
  });
  if(any){
    if(S.have.size){
      html+= need.size
        ? `<div class="shop"><b>🛒 더 사야 할 재료</b>${[...need].map(esc).join(', ')}
            <div style="margin-top:8px"><button class="swap" id="copyShop" style="margin:0">장보기 목록 복사</button></div></div>`
        : `<div class="shop"><b>🛒 장 안 봐도 돼요!</b>있는 재료로 다 만들 수 있어요.</div>`;
    }
    html+=`<div class="row2"><button class="btn ghost" id="again">전부 다시 추천</button><button class="btn ok" id="decide">오늘 이걸로 할게요</button></div>`;
  }
  html+=webBlock();
  html+=`</div>`;
  box.innerHTML=html;
  bindWeb();

  box.querySelectorAll('.swap[data-t]').forEach(b=>b.onclick=()=>{
    const t=b.dataset.t; const cur=S.picked[t];
    const nd=pickSlot(t, cur?[cur.n]:[]);
    if(nd) S.picked[t]=nd; else { b.textContent='다른 요리가 더 없어요'; return; }
    renderResult(false);
  });
  const ag=$('again'); if(ag) ag.onclick=recommend;
  const dc=$('decide'); if(dc) dc.onclick=()=>{
    const names=sl.map(([t])=>S.picked[t]).filter(Boolean).map(d=>d.n);
    S.hist.unshift({names,ts:Date.now()}); S.hist=S.hist.slice(0,30); store.set('dn_hist',S.hist);
    renderHist();
    dc.parentElement.outerHTML=`<div class="done">맛있게 드세요! 😊 오늘 메뉴는 기록해 둘게요.</div>`;
  };
  const cp=$('copyShop'); if(cp) cp.onclick=async()=>{
    const text='장보기: '+[...need].join(', ');
    try{ await navigator.clipboard.writeText(text); cp.textContent='복사했어요 ✔'; }
    catch(e){ cp.textContent='복사가 안 돼요. 위 글자를 길게 눌러 복사해 주세요'; }
  };
}

// ---- 인터넷 레시피 찾기 ----
// 앱에 없는 재료를 먼저, 최대 3개까지 넣어 검색어를 만들어 둠 (직접 고칠 수 있음)
function defaultQuery(){
  const words=[...S.have];
  const unknown=words.filter(w=>!known(w)), rest=words.filter(w=>known(w));
  return [...unknown,...rest].slice(0,3).join(' ');
}
const SITES=[
  ['만개의레시피', q=>'https://www.10000recipe.com/recipe/list.html?q='+encodeURIComponent(q)],
  ['네이버', q=>'https://search.naver.com/search.naver?query='+encodeURIComponent(q+' 요리 레시피')],
  ['유튜브', q=>'https://www.youtube.com/results?search_query='+encodeURIComponent(q+' 레시피')],
];
function webBlock(){
  const q=defaultQuery();
  const unknown=[...S.have].filter(w=>!known(w));
  return `<div class="web">
    <b>🔎 내 재료로 인터넷에서 레시피 찾기</b>
    <p>검색어를 고칠 수 있어요. 재료를 2~3개만 넣어야 결과가 잘 나와요.</p>
    <input id="webQ" type="text" value="${esc(q)}" placeholder="예: 가지 돼지고기">
    <div class="links">${SITES.map(([n,f],k)=>`<a id="wl${k}" href="${esc(f(q||'저녁 메뉴'))}" target="_blank" rel="noopener">${n}</a>`).join('')}</div>
    ${unknown.length?`<p class="note">“${unknown.map(esc).join(', ')}”은(는) 앱에 저장된 요리에는 안 쓰여서, 위 인터넷 검색으로 찾아보시는 게 좋아요.</p>`:''}
  </div>`;
}
function bindWeb(){
  const inp=$('webQ'); if(!inp) return;
  inp.oninput=()=>{ const q=inp.value.trim()||'저녁 메뉴'; SITES.forEach(([,f],k)=>{ $('wl'+k).href=f(q); }); };
}

// ---- 기록 ----
function ago(ts){
  const d=Math.round((new Date().setHours(0,0,0,0)-new Date(ts).setHours(0,0,0,0))/86400000);
  return d===0?'오늘':d===1?'어제':d+'일 전';
}
function renderHist(){
  const h=$('hist');
  if(!S.hist.length){ h.innerHTML='<p class="empty">아직 기록이 없어요. "오늘 이걸로 할게요"를 누르면 여기에 남아요.</p>'; return; }
  h.innerHTML=S.hist.slice(0,7).map(x=>`<div><span>${x.names.map(esc).join(' + ')}</span><small>${ago(x.ts)}</small></div>`).join('');
}
$('clearHist').onclick=()=>{ S.hist=[]; store.set('dn_hist',[]); renderHist(); };

renderIngs(); renderHist();
</script>
</body>
</html>
